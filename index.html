<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2E7D32">
  <title>グレードブック</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════════════ -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-logo">📒</div>
    <h1 class="login-title">グレードブック</h1>
    <p class="login-sub">教師・管理者・モデレーター専用</p>

    <div class="modal-tabs" id="login-tabs">
      <button class="modal-tab active" data-tab="email">📧 メール</button>
      <button class="modal-tab"        data-tab="sid">🎓 学籍番号</button>
    </div>

    <div id="login-email-form">
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" id="l-email" placeholder="teacher@school.ed.jp">
      </div>
      <div class="field">
        <label>パスワード</label>
        <input type="password" id="l-pass" placeholder="••••••••">
      </div>
    </div>
    <div id="login-sid-form" style="display:none">
      <div class="field">
        <label>学籍番号</label>
        <input type="text" id="l-sid" placeholder="例：T001">
      </div>
      <div class="field">
        <label>パスワード</label>
        <input type="password" id="l-sidpass" placeholder="••••••••">
      </div>
    </div>

    <div class="login-err hidden" id="login-err"></div>
    <button class="btn-primary login-btn" id="login-btn">ログイン</button>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════════════════════ -->
<div id="screen-app" class="screen">
  <header class="app-header">
    <div class="header-left">
      <span class="app-icon">📒</span>
      <div>
        <div class="app-title">グレードブック</div>
        <div class="app-sub" id="header-sub">読み込み中...</div>
      </div>
    </div>
    <div class="header-right">
      <button id="theme-btn" class="icon-btn">🌙</button>
      <button id="logout-btn" class="btn-outline btn-sm">ログアウト</button>
    </div>
  </header>

  <div id="gb-root"></div>
</div>

<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('[GB] SW:', r.scope))
      .catch(e => console.warn('[GB] SW fail:', e));
  }
</script>
</body>
</html>
